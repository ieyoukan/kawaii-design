<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>こはる文具店</title>
  <style>
    :root {
      --paper: #fff8f4;
      --blue: #eaf2fa;
      --pink: #f8dfe3;
      --ink: #442d39;
      --space: clamp(1.5rem, 6vw, 5.5rem);
      --wave-height: clamp(3rem, 8vw, 7rem);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 1rem/1.8 "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    h1, h2 {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      font-weight: 800;
      line-height: 1.06;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    p { max-width: 26em; margin: 1.5rem 0 0; }
    svg { display: block; width: 100%; height: auto; }

    .layout {
      width: min(100% - 2 * var(--space), 70rem);
      margin-inline: auto;
      display: grid;
      grid-template-columns: minmax(0, 4fr) minmax(0, 5fr);
      gap: clamp(1.25rem, 5vw, 5rem);
      align-items: center;
    }

    .hero {
      padding-block: clamp(3.5rem, 9vw, 8rem) calc(var(--wave-height) + 2.5rem);
    }

    h1 { font-size: clamp(2.9rem, 7.9vw, 7rem); letter-spacing: -.06em; }

    .catalog-link {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      min-block-size: 44px;
      margin-block-start: .75rem;
      color: inherit;
      text-underline-offset: .23em;
    }

    .catalog-link:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }

    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
      h1 { animation: title-enter 540ms cubic-bezier(.22, 1, .36, 1) both; }
      @keyframes title-enter {
        from { opacity: .72; transform: translateY(.75rem); }
        to { opacity: 1; transform: translateY(0); }
      }
    }

    .catalog { position: relative; background: var(--blue); }
    .wave {
      position: absolute;
      inset-inline-start: 0;
      inset-block-end: calc(100% - 1px);
      height: var(--wave-height);
      color: var(--blue);
      pointer-events: none;
    }

    .collection {
      padding-block: clamp(3.5rem, 8vw, 7rem);
    }

    .collection + .collection { padding-block-start: clamp(1.5rem, 5vw, 4rem); }

    h2 { font-size: clamp(3.25rem, 9vw, 8rem); letter-spacing: -.07em; }

    .paper .layout {
      isolation: isolate;
      grid-template-areas: "title title" "copy art";
      align-items: start;
      row-gap: clamp(.75rem, 2vw, 1.5rem);
    }

    .paper-title {
      --title-outline: #758aa4;
      grid-area: title;
      font-size: clamp(4.5rem, 17vw, 16rem);
      font-weight: 500;
      line-height: .99;
      color: var(--title-outline);
    }

    @supports (-webkit-text-stroke: 1px currentColor) {
      .paper-title {
        -webkit-text-stroke: clamp(1.25px, .12vw, 1.75px) var(--title-outline);
        color: transparent;
      }
    }

    @media (forced-colors: active) {
      .paper-title { -webkit-text-stroke: 0; color: CanvasText; }
    }

    .paper .layout > p { grid-area: copy; margin: 0; }
    .paper .layout > svg {
      grid-area: art;
      z-index: 1;
      margin-block-start: clamp(-9.5rem, -11vw, -3.5rem);
      margin-inline-start: clamp(-1.5rem, -2vw, -.75rem);
    }

    .wrap h2 { font-size: clamp(3rem, 6.5vw, 6rem); }

    .wrap .layout { grid-template-columns: minmax(0, 5fr) minmax(0, 4fr); }
    .wrap .layout > svg { grid-column: 1; grid-row: 1; }
    .wrap .layout > div { grid-column: 2; grid-row: 1; }

    @media (max-width: 42rem) {
      .layout, .wrap .layout { grid-template-columns: minmax(0, 1fr); }
      .wrap .layout > svg, .wrap .layout > div { grid-area: auto; }
      .layout > svg { width: min(100%, 28rem); justify-self: center; }
      .paper .layout { grid-template-areas: "title" "art" "copy"; }
      .paper-title { font-size: clamp(4.5rem, 24vw, 10rem); }
      .paper .layout > svg {
        justify-self: end;
        width: min(78%, 24rem);
        margin-block-start: clamp(-4.25rem, -13vw, -2.75rem);
        margin-inline-start: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="layout">
        <div>
          <h1>こはる<wbr>文具店</h1>
          <p>手紙を書いたり、小さな贈りものを包んだり。日々のための紙と文具を集めました。</p>
          <a class="catalog-link" href="#paper">紙ものを見る <span aria-hidden="true">↓</span></a>
        </div>
        <svg viewBox="0 0 500 380" aria-hidden="true">
          <defs>
            <pattern id="hero-dots" width="18" height="18" patternUnits="userSpaceOnUse">
              <circle cx="9" cy="9" r="1.15" fill="#934d72" opacity=".14"/>
            </pattern>
            <path id="hero-surface" d="M58 84C95 31 152 27 215 41C278 56 309 31 359 35C432 41 484 104 476 171C469 227 426 246 412 288C394 342 331 366 278 349C232 334 195 316 144 329C76 346 20 307 21 241C22 192 81 161 58 84Z"/>
          </defs>
          <use href="#hero-surface" fill="var(--pink)"/>
          <use href="#hero-surface" fill="url(#hero-dots)"/>
          <g transform="translate(109 110) rotate(-13 125 80)">
            <rect x="4" y="9" width="244" height="152" rx="8" fill="#7e3e5d" opacity=".13"/>
            <rect width="244" height="152" rx="8" fill="#fffdf9"/>
            <path d="M28 38H145M28 60H166M28 82H133" stroke="#dbc2c7" stroke-width="2" stroke-linecap="round"/>
            <path d="M191 42q-12-9-18 0q-6 9 10 21q18-2 20-10q2-11-12-11Z" fill="#eea9bb"/>
          </g>
          <g transform="translate(197 168) rotate(11 109 67)">
            <rect x="3" y="7" width="218" height="134" rx="9" fill="#7e3e5d" opacity=".14"/>
            <rect width="218" height="134" rx="9" fill="#d2e5f6"/>
            <path d="M7 128L88 65Q109 51 130 65L211 128" fill="none" stroke="#abc8e3" stroke-width="2"/>
            <path d="M6 6L94 77Q109 89 124 77L212 6Z" fill="#e3effa"/>
            <path d="M112 60C121 57 127 65 125 73C130 86 118 94 110 90C99 97 90 85 94 77C91 67 102 60 112 60Z" fill="#d889a5"/>
          </g>
        </svg>
      </div>
    </header>

    <div class="catalog">
      <!-- One curved seam. Both collections below share the same blue surface. -->
      <svg class="wave" viewBox="0 0 1440 112" preserveAspectRatio="none" aria-hidden="true">
        <path fill="currentColor" opacity=".6" d="M0 38C118 36 187 13 301 24S452 65 570 61S776 27 907 22S1074 54 1180 47S1350 13 1440 29V112H0Z"/>
        <path fill="currentColor" d="M0 55C116 55 142 23 272 25S445 88 594 79S785 37 902 36S1026 61 1110 60S1300 19 1440 46V112H0Z"/>
      </svg>

      <section id="paper" class="collection paper" aria-labelledby="paper-title">
        <div class="layout">
          <h2 id="paper-title" class="paper-title">紙もの</h2>
          <p>便箋やメモ帳。鉛筆で書くと、紙の手触りが少しだけ指に伝わります。</p>
          <svg viewBox="0 0 500 260" aria-hidden="true">
            <!-- A folded sheet carries the edge of the stationery collection. -->
            <path d="M51 65Q48 47 68 44L360 17Q376 16 389 29L448 83Q462 96 464 114L477 200Q480 215 463 219L83 241Q62 243 60 223Z" fill="#dbe9f8"/>
            <path d="M370 18Q381 20 389 29L448 83Q459 93 462 104L391 110Q380 111 379 99Z" fill="#c5d9ed"/>
            <g transform="translate(126 55) rotate(-9 102 68)">
              <rect x="5" y="8" width="206" height="138" rx="5" fill="#426694" opacity=".15"/>
              <rect width="206" height="138" rx="5" fill="#fffdf9"/>
              <path d="M22 34H183M22 57H183M22 80H183M22 103H152" stroke="#ccd9ea" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g transform="translate(271 118) rotate(14 61 45)">
              <rect x="3" y="5" width="122" height="90" rx="4" fill="#8a5364" opacity=".16"/>
              <rect width="122" height="90" rx="4" fill="#f9dbe2"/>
              <path d="M16 18H105M16 32H105M16 46H88" stroke="#ce839b" stroke-width="1.5" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
      </section>

      <section id="wrap" class="collection wrap" aria-labelledby="wrap-title">
        <div class="layout">
          <div>
            <h2 id="wrap-title">つつむもの</h2>
            <p>薄い包装紙とリボン。おすそわけのお菓子を、ひとつずつ包むときに。</p>
          </div>
          <svg viewBox="0 0 500 280" aria-hidden="true">
            <defs>
              <pattern id="wrap-check" width="24" height="24" patternUnits="userSpaceOnUse">
                <path d="M0 0H12V24H0Z" fill="#ad5975" opacity=".08"/>
                <path d="M0 0H24V12H0Z" fill="#ad5975" opacity=".08"/>
              </pattern>
              <path id="wrap-surface" d="M244 84C204 29 147 13 105 33C56 56 53 109 75 148C102 195 180 219 240 260Q247 265 255 258C320 214 395 185 422 138C447 94 431 42 383 27C334 11 275 38 244 84Z"/>
            </defs>
            <use href="#wrap-surface" fill="#f7e0e6" stroke="#dcaebd" stroke-width="2"/>
            <use href="#wrap-surface" fill="url(#wrap-check)"/>
            <g transform="translate(157 89) rotate(-7 86 66)">
              <rect x="4" y="8" width="172" height="132" rx="8" fill="#7e3e5d" opacity=".13"/>
              <rect width="172" height="132" rx="8" fill="#fffbf5"/>
              <path d="M86 0V132M0 66H172" stroke="#ce899f" stroke-width="10"/>
              <path d="M86 66C41 63 41 30 62 36C76 40 86 66 86 66ZM86 66C130 65 131 31 111 36C97 41 86 66 86 66ZM86 66L64 94M86 66L115 89" fill="none" stroke="#ce899f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
