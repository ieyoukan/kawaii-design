<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ようかん</title>
<!--
  Direction (kawaii-design)
  前提: おまかせ。プロフィールは依頼文の内容だけ。性格・年齢の見立ては立ち絵とことばから読んだ推測。
  Character   : 少女・おっとり(眠たげ)+少し元気・ひらがな多めで「〜」がのびる・ねこみみ、鈴、三日月のヘアピン、水色のリボンとメイドエプロン
  Product     : VRChat のイベント「ぷぷりえ」の店員さん、ようかんをフレンドやお客さんに紹介する1枚のページ
  Dialect     : ゆめかわ。ファンページで、本人の色が水色、依頼が「カラフルなグラデーション+ガラス」なので
  Feel        : ふわっと、のんびり、ちょっとねむたげ
  World       : 水色のシャボン玉がうかぶ、ぷぷりえのガラスのショーケース。モチーフはヘアピンの三日月
  Star        : ヒーローは立ち絵(タップ/ホバーでばんざい)。じこしょうかいはウインクの写真。すきなもの・リンクは Stage
  Shape       : 全体はひらいたまま。ガラスは角丸(大きいものほどゆるく)、ボタンとチップはピル。
                じこしょうかいは本人をさす吹き出し、ねるカードは寄りかかって少し傾く。フッターは大きな波で入る
  Atmosphere  : Liquid Glass。水色が主役の虹色背景(ピンク・ラベンダー、レモンは背景の中だけ)と、
                屈折させるためのシャボン玉。ヘッダー・カード・吹き出し・フッター・ボタンをガラスに
  Type/motion : 名前は Kiwi Maru の大きな文字に白いふち。h2 はひらがなで中くらい。
                動くのは立ち絵の登場1回だけ(位置のみ、透明度は使わない)。ナビはスムーズスクロール、reduced-motion ではジャンプ
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #213E5E;
  --ink-soft: #3A5878;
  --aqua: #8FD3F0;
  --aqua-deep: #3E9BCB;
  --pink: #F4BFDD;
  --lav: #CBC3F3;
  --star-dark: 58 82 122;
  --ease-poyon: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body {
  background: #EEF8FC;
  color: var(--ink);
  font-family: "M PLUS Rounded 1c", system-ui, sans-serif;
  font-weight: 500;
  line-height: 1.85;
  letter-spacing: .03em;
  word-break: auto-phrase;
  overflow-x: clip;
}
h1, h2, h3 { text-wrap: balance; font-weight: 500; margin: 0; }
a { color: inherit; }
img { display: block; }

/* ---------- iridescent background, aqua-led ---------- */
.page { position: relative; isolation: isolate; }
.page::before {
  content: ""; position: fixed; inset: -12%; z-index: -2; pointer-events: none;
  background:
    radial-gradient(38% 30% at 18% 22%, #A6E0F5 0%, transparent 70%),
    radial-gradient(44% 34% at 80% 28%, #B8E6F7 0%, transparent 72%),
    radial-gradient(40% 32% at 62% 80%, #9CD6F1 0%, transparent 70%),
    radial-gradient(30% 26% at 24% 70%, #ACE0F4 0%, transparent 70%),
    radial-gradient(24% 20% at 40% 52%, #FFFFFF 0%, transparent 70%),
    radial-gradient(24% 20% at 88% 66%, #F6C5E1 0%, transparent 70%),
    radial-gradient(22% 18% at 8% 46%, #D3C9F6 0%, transparent 70%),
    radial-gradient(20% 16% at 58% 8%, #F4C9E4 0%, transparent 70%),
    radial-gradient(12% 10% at 46% 30%, #FFF1B5 0%, transparent 70%),
    linear-gradient(118deg, transparent 28%, #FFFFFF 41%, transparent 54%),
    linear-gradient(28deg, transparent 56%, rgb(244 191 221 / .5) 65%, transparent 75%),
    #E4F5FC;
  filter: url(#swirl) blur(6px);
}

/* glossy bubbles: the things the glass bends */
.bubble {
  position: absolute; z-index: -1; pointer-events: none;
  width: var(--s); aspect-ratio: 1; border-radius: 50%;
  background:
    radial-gradient(circle at 30% 26%, #fff 0 7%, rgb(255 255 255 / 0) 20%),
    conic-gradient(from 210deg, #F4BFDD, #9ED8F2, #CBC3F3, #FFFFFF, #8FD3F0, #F4BFDD);
  -webkit-mask: radial-gradient(circle, rgb(0 0 0 / .32) 0 58%, #000 71%);
          mask: radial-gradient(circle, rgb(0 0 0 / .32) 0 58%, #000 71%);
}

/* ---------- liquid glass ---------- */
.liquid {
  position: relative;
  border-radius: 28px;
  background: linear-gradient(135deg,
    rgb(190 232 248 / .42), rgb(255 255 255 / .30) 48%, rgb(250 212 234 / .40));
  box-shadow:
    0 14px 36px rgb(var(--star-dark) / .18),
    inset 0 1px 1px rgb(255 255 255 / .9),
    inset 0 -6px 16px rgb(255 255 255 / .18),
    inset 0 0 0 1px rgb(255 255 255 / .5);
  backdrop-filter: blur(14px) saturate(1.5);
  -webkit-backdrop-filter: blur(14px) saturate(1.5);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .liquid { background: rgb(255 255 255 / .82); }
}
.liquid.reading {   /* more white behind long text */
  background: linear-gradient(135deg,
    rgb(205 238 250 / .66), rgb(255 255 255 / .60) 50%, rgb(252 222 239 / .64));
}

/* ---------- header: floating capsule ---------- */
.nav {
  position: fixed; z-index: 10; top: 16px; left: 50%; translate: -50% 0;
  border-radius: 9999px;
  padding: 6px;
}
.nav ul { display: flex; gap: 2px; margin: 0; padding: 0; list-style: none; }
.nav a {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: 9999px;
  text-decoration: none; font-size: 15px; font-weight: 700; white-space: nowrap;
  transition: background-color .2s var(--ease-soft);
}
.nav a:hover { background: rgb(255 255 255 / .5); }
.nav a:focus-visible, .chip:focus-visible, .star:focus-visible, .foot a:focus-visible {
  outline: 3px solid var(--aqua-deep); outline-offset: 3px;
}
.nav .moon { width: 18px; height: 18px; color: var(--aqua-deep); }

section { scroll-margin-block-start: 96px; }

/* ---------- hero (Star) ---------- */
.hero {
  position: relative;
  min-height: 100svh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  max-width: 1280px; margin: 0 auto;
  padding: 88px 48px 28px;
}
.hero-text { position: relative; z-index: 2; padding-bottom: 96px; justify-self: end; margin-right: -40px; }
.name {
  position: relative;
  font-family: "Kiwi Maru", serif;
  font-size: clamp(64px, 9.2vw, 136px);
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: .06em;
  color: var(--ink);
  -webkit-text-stroke: 14px #fff;
  paint-order: stroke fill;
  filter: drop-shadow(0 10px 18px rgb(var(--star-dark) / .16));
}
.name .pin {
  position: absolute; top: -.06em; right: -.04em;
  width: .3em; height: .3em; color: var(--aqua-deep);
  rotate: -18deg;
}
.role {
  margin: 20px 0 0 6px;
  font-family: "Kiwi Maru", serif;
  font-size: clamp(20px, 2vw, 26px);
  letter-spacing: .08em;
}
.chip {
  margin: 22px 0 0;
  display: inline-flex; align-items: center; gap: 12px;
  padding: 10px 14px 10px 22px;
  border: 0; border-radius: 9999px;
  font: inherit; color: var(--ink); cursor: pointer;
  transition: transform .35s var(--ease-poyon);
}
.chip:active { transform: scale(1.04, .96); }
.chip .label { font-size: 13px; color: var(--ink-soft); }
.chip .id { font-size: 17px; font-weight: 700; }
.chip .ico {
  display: grid; place-items: center;
  width: 34px; height: 34px; border-radius: 50%;
  background: rgb(255 255 255 / .7);
}
.chip svg { width: 18px; height: 18px; }
.chip .done { display: none; font-size: 14px; }
.chip.copied .id, .chip.copied .label { display: none; }
.chip.copied .done { display: inline; }

.star {
  position: relative; z-index: 1;
  justify-self: start;
  align-self: end;
  margin: 0 0 0 -20px;
  padding: 0; border: 0; background: none; cursor: pointer;
  height: min(calc(100svh - 116px), 860px);
  aspect-ratio: 706 / 1215;
  -webkit-tap-highlight-color: transparent;
}
.star::after {            /* contact shadow */
  content: ""; position: absolute; left: 50%; bottom: 1%;
  width: 34%; height: 3%; translate: -50% 0; z-index: -1;
  border-radius: 50%;
  background: rgb(var(--star-dark) / .30);
  filter: blur(7px);
}
.star-art {
  position: absolute; inset: 0;
  animation: settle 900ms var(--ease-poyon) 150ms both;
}
.star img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  filter:
    saturate(1.15) contrast(1.04)
    drop-shadow(0 2px 2px rgb(var(--star-dark) / .22))
    drop-shadow(12px 20px 26px rgb(var(--star-dark) / .20));
  transition: opacity .15s linear;
}
.star .banzai { opacity: 0; }
.star.is-banzai .stand { opacity: 0; }
.star.is-banzai .banzai { opacity: 1; }
@keyframes settle {
  from { transform: translateY(34px) scale(.97); }
  to   { transform: none; }
}

/* ---------- shared section ---------- */
.section {
  position: relative;
  max-width: 1120px; margin: 0 auto;
  padding: 112px 48px 0;
}
.section h2 {
  font-family: "Kiwi Maru", serif;
  font-size: clamp(34px, 4.4vw, 56px);
  letter-spacing: .08em;
  margin-bottom: 48px;
  color: var(--ink);
  -webkit-text-stroke: 8px #fff;
  paint-order: stroke fill;
}

/* ---------- じこしょうかい ---------- */
.intro {
  display: grid;
  grid-template-columns: 400px minmax(0, 1fr);
  gap: 56px;
  align-items: center;
}
.print {
  position: relative; margin: 0;
  padding: 14px 14px 46px;
  background: #fff;
  border-radius: 10px;
  rotate: -2.5deg;
  box-shadow: 0 2px 3px rgb(var(--star-dark) / .12), 10px 18px 30px rgb(var(--star-dark) / .18);
}
.print img { width: 100%; height: auto; border-radius: 4px; }
.tape {
  position: absolute; top: -18px; left: 50%; translate: -50% 0; rotate: 4deg;
  width: 132px; height: 40px; border-radius: 10px;
}
.say { position: relative; }
.bubble-card {
  padding: 40px 44px;
  border-radius: 36px;
  font-size: 19px;
  line-height: 2.1;
}
.bubble-card p { margin: 0; }
.tail {               /* points left, at the wink photo */
  position: absolute; left: -26px; top: 46%;
  width: 30px; height: 40px;
  background: rgb(226 244 252 / .95);
  -webkit-clip-path: path("M30 0 C22 14 8 22 2 24 C10 26 22 30 30 40 Z");
          clip-path: path("M30 0 C22 14 8 22 2 24 C10 26 22 30 30 40 Z");
  backdrop-filter: blur(14px);
}

/* ---------- すきなもの ---------- */
.likes {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px; margin: 0; padding: 0; list-style: none;
}
.like {
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding: 36px 24px 32px;
  border-radius: 32px;
  text-align: center;
  font-size: 18px; font-weight: 700;
}
.like svg { width: 96px; height: 96px; }
.like.sleepy { rotate: 2.5deg; translate: 0 10px; }   /* leaning, a little sleepy */

/* ---------- footer ---------- */
.foot {
  position: relative;
  z-index: 0;
  margin-top: 160px;
  padding: 40px 24px 72px;
  background: #F3FAFE;
}
.wave {
  position: absolute; left: 0; bottom: calc(100% - 1px);
  width: 100%; height: clamp(48px, 8vw, 120px);
  color: #F3FAFE;
  pointer-events: none;
}
.foot-glass {
  position: relative;
  max-width: 560px; margin: 0 auto;
  padding: 28px;
  border-radius: 40px;
  display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
}
.foot a {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 14px 28px 14px 18px;
  border-radius: 9999px;
  text-decoration: none;
  font-family: "Kiwi Maru", serif; font-size: 19px;
  background: linear-gradient(160deg, rgb(255 255 255 / .75), rgb(255 255 255 / .45));
  box-shadow:
    inset 0 1px 1px #fff,
    inset 0 0 0 1px rgb(255 255 255 / .7),
    0 6px 16px rgb(var(--star-dark) / .14);
  transition: transform .4s var(--ease-poyon);
}
.foot a:hover { transform: translateY(-2px); }
.foot a:active { transform: scale(1.05, .95); }
.foot a.home {   /* iridescent rim on the one primary link */
  border: 2px solid transparent;
  background:
    linear-gradient(160deg, rgb(255 255 255 / .85), rgb(255 255 255 / .6)) padding-box,
    linear-gradient(120deg, #F4BFDD, #8FD3F0, #CBC3F3) border-box;
}
.foot a svg { width: 24px; height: 24px; }

/* ---------- mobile ---------- */
@media (max-width: 820px) {
  .nav { top: 12px; }
  .nav a { padding: 8px 12px; font-size: 14px; }
  .nav .moon { display: none; }
  .hero {
    grid-template-columns: 1fr;
    min-height: auto;
    padding: 80px 16px 0;
  }
  .hero-text { display: contents; }
  .hero { padding-top: 76px; }
  .name {
    position: absolute; z-index: 2; top: 84px; left: 14px;
    writing-mode: vertical-rl;
    font-size: 60px;
    -webkit-text-stroke: 10px #fff;
  }
  .name .pin { display: none; }
  .star {
    order: -1;
    justify-self: center; margin: 0 0 0 36px;
    height: min(calc(100svh - 92px), 720px);
  }
  .role, .chip { justify-self: center; }
  .role { margin: 24px 0 0; text-align: center; }
  .chip { margin: 14px 0 0; }
  .section { padding: 96px 20px 0; }
  .section h2 { margin-bottom: 36px; }
  .intro { grid-template-columns: 1fr; gap: 40px; }
  .print { width: min(100%, 320px); justify-self: center; }
  .bubble-card { padding: 30px 26px; font-size: 17px; }
  .tail {          /* points up, at the photo above */
    left: 50%; top: -28px; translate: -50% 0;
    width: 40px; height: 30px;
    -webkit-clip-path: path("M0 30 C14 22 22 8 24 2 C26 10 30 22 40 30 Z");
            clip-path: path("M0 30 C14 22 22 8 24 2 C26 10 30 22 40 30 Z");
  }
  .likes { grid-template-columns: 1fr; gap: 20px; }
  .like { flex-direction: row; text-align: left; padding: 20px 24px; }
  .like svg { width: 64px; height: 64px; flex: none; }
  .like.sleepy { rotate: 1.5deg; translate: 0 4px; }
  .foot { margin-top: 120px; }
  .foot-glass { padding: 22px 18px; }
  .foot a { font-size: 17px; padding: 12px 22px 12px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .star-art { animation: none; }
  .chip, .foot a, .star img { transition: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="swirl">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.007" numOctaves="2" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="120"/>
  </filter>
  <symbol id="moon" viewBox="0 0 24 24">
    <path d="M15.5 3.2a8.6 8.6 0 1 0 5.3 13.9A7.2 7.2 0 0 1 15.5 3.2Z" fill="currentColor"/>
  </symbol>
</svg>

<nav class="nav liquid" aria-label="ページ内">
  <ul>
    <li><a href="#intro"><svg class="moon" aria-hidden="true"><use href="#moon"/></svg>じこしょうかい</a></li>
    <li><a href="#likes">すきなもの</a></li>
    <li><a href="#links">リンク</a></li>
  </ul>
</nav>

<main class="page">
  <span class="bubble" style="--s:220px; left:41%; top:-70px" aria-hidden="true"></span>
  <span class="bubble" style="--s:120px; left:6%; top:62%" aria-hidden="true"></span>
  <span class="bubble" style="--s:300px; right:-90px; top:340px" aria-hidden="true"></span>

  <header class="hero">
    <div class="hero-text">
      <h1 class="name">ようかん<svg class="pin" aria-hidden="true"><use href="#moon"/></svg></h1>
      <p class="role">ぷぷりえの店員さん</p>
      <button class="chip liquid" type="button" data-copy="ようかんYokan" aria-live="polite">
        <span class="label">VRChat ID</span>
        <span class="id">ようかんYokan</span>
        <span class="done">コピーしました</span>
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        </span>
      </button>
    </div>
    <button class="star" type="button" aria-label="ようかん" aria-pressed="false">
      <span class="star-art">
        <img class="stand" src="../../compare/character/assets/youkan-stand.webp" alt="水色のメイド服を着た、ねこみみのようかん" width="706" height="1215" fetchpriority="high">
        <img class="banzai" src="../../compare/character/assets/youkan-banzai.webp" alt="" width="706" height="1215">
      </span>
    </button>
  </header>

  <section class="section" id="intro" aria-labelledby="intro-h">
    <span class="bubble" style="--s:160px; left:30%; top:150px" aria-hidden="true"></span>
    <span class="bubble" style="--s:110px; right:2%; top:180px" aria-hidden="true"></span>
    <h2 id="intro-h">じこしょうかい</h2>
    <div class="intro">
      <figure class="print">
        <span class="tape liquid" aria-hidden="true"></span>
        <img src="../../compare/character/assets/youkan-wink.webp" alt="ウインクするようかん" width="680" height="565" loading="lazy">
      </figure>
      <div class="say">
        <span class="tail" aria-hidden="true"></span>
        <blockquote class="bubble-card liquid reading" style="margin:0">
          <p>ようかんっていいます～よろしくね～。えっと水色の可愛いのとも好きかも！ぷぷりえの友達と遊ぶのが大好き！</p>
        </blockquote>
      </div>
    </div>
  </section>

  <section class="section" id="likes" aria-labelledby="likes-h">
    <span class="bubble" style="--s:180px; left:-40px; top:200px" aria-hidden="true"></span>
    <span class="bubble" style="--s:140px; left:62%; top:330px" aria-hidden="true"></span>
    <span class="bubble" style="--s:96px; right:4%; top:120px" aria-hidden="true"></span>
    <h2 id="likes-h">すきなもの</h2>
    <ul class="likes">
      <li class="like liquid">
        <svg viewBox="0 0 96 96" aria-hidden="true" fill="none" stroke="#213E5E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M46 46 C36 30 18 26 14 34 C10 44 22 56 46 50 Z" fill="#9ED8F2"/>
          <path d="M50 46 C60 30 78 26 82 34 C86 44 74 56 50 50 Z" fill="#9ED8F2"/>
          <path d="M45 52 C40 62 34 70 30 78 L39 76 L42 84 C46 74 48 64 48 54" fill="#BFE6F7"/>
          <path d="M51 52 C56 62 62 70 66 78 L57 76 L54 84 C50 74 48 64 48 54" fill="#BFE6F7"/>
          <rect x="42" y="42" width="12" height="12" rx="5" fill="#F4BFDD"/>
        </svg>
        <span>水色の可愛いの</span>
      </li>
      <li class="like liquid">
        <svg viewBox="0 0 96 96" aria-hidden="true" fill="none" stroke="#213E5E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 64 C14 46 20 34 32 34 C44 34 50 46 50 64 Z" fill="#9ED8F2"/>
          <circle cx="32" cy="30" r="4" fill="#fff"/>
          <path d="M14 64 H50" />
          <circle cx="32" cy="69" r="4" fill="#CBC3F3"/>
          <path d="M46 70 C46 52 52 40 64 40 C76 40 82 52 82 70 Z" fill="#F4BFDD"/>
          <circle cx="64" cy="36" r="4" fill="#fff"/>
          <path d="M46 70 H82" />
          <circle cx="64" cy="75" r="4" fill="#CBC3F3"/>
          <path d="M28 50 q4 -4 8 0" /><path d="M60 56 q4 -4 8 0" />
        </svg>
        <span>ぷぷりえの友達と遊ぶこと</span>
      </li>
      <li class="like liquid sleepy">
        <svg viewBox="0 0 96 96" aria-hidden="true" fill="none" stroke="#213E5E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 66 C12 54 22 50 48 50 C74 50 84 54 84 66 C84 76 74 80 48 80 C22 80 12 76 12 66 Z" fill="#CBC3F3"/>
          <path d="M24 62 C34 60 62 60 72 62" stroke="#fff"/>
          <path d="M58 14 a16 16 0 1 0 18 24 a13 13 0 0 1 -18 -24 Z" fill="#9ED8F2"/>
          <path d="M28 24 h8 l-8 9 h8" stroke-width="2"/>
          <path d="M40 34 h6 l-6 7 h6" stroke-width="2"/>
        </svg>
        <span>おうちで寝ること</span>
      </li>
    </ul>
  </section>

  <footer class="foot" id="links">
    <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
      <path fill="currentColor" d="M0 70 C140 70 200 18 360 20 S600 104 780 96 S1000 30 1140 32 S1340 84 1440 56 V120 H0 Z"/>
    </svg>

<script>
  // Glass on the chrome. The rim leans toward ようかん's colors: aqua first, then pink and lavender.
  const tint = ['#A9E3F5', '#F7C8E4', '#BFE9F7', '#D6C8F6'];
  document.querySelectorAll('.liquid').forEach(el => {
    if (!window.kawaiiGlass) return;
    if (el.classList.contains('bubble-card')) kawaiiGlass(el, { tint, tintAmount: 0.3, rim: 18 });
    else kawaiiGlass(el, { tint });
  });

  // Pose change: hover with a mouse, tap or keyboard otherwise.
  const star = document.querySelector('.star');
  const setPose = on => { star.classList.toggle('is-banzai', on); star.setAttribute('aria-pressed', on); };
  let lastPointer = '';
  star.addEventListener('pointerdown', e => { lastPointer = e.pointerType; });
  star.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') setPose(true); });
  star.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setPose(false); });
  star.addEventListener('click', () => {
    if (lastPointer !== 'mouse') setPose(!star.classList.contains('is-banzai'));
    lastPointer = '';
  });

  // Copy the VRChat ID.
  const chip = document.querySelector('.chip');
  chip.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(chip.dataset.copy);
      chip.classList.add('copied');
      setTimeout(() => chip.classList.remove('copied'), 1800);
    } catch (e) {}
  });
</script>
